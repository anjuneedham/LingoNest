name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, lint, test, validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (core, content)
        run: npm test

      - name: Validate curriculum content
        run: npm run content:validate

  migrations:
    name: Verify database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17
        # Matches supabase/config.toml's db.major_version — Ubuntu's default
        # archive only ships the version current at release time, so this
        # needs the official PostgreSQL apt repository.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17

      - name: Apply migrations and run schema assertions
        run: bash scripts/verify-migrations.sh
