name: Deploy Supabase

# Applies supabase/migrations against the real project and seeds the
# curriculum on every push to main. Both steps are idempotent (the
# migrations are already verified in CI against a throwaway Postgres by
# scripts/verify-migrations.sh; db:seed upserts by natural key), so a push
# that touches nothing here is a fast no-op rather than a risk.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "packages/content/**"
      - "scripts/seed-content.mjs"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch: {}

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push migrations
        # Installed via npm rather than supabase/setup-cli@v1: that action
        # resolves "latest" through GitHub's unauthenticated releases API,
        # which is rate-limited and fails intermittently on shared runners.
        #
        # Connects through Supavisor (the pooler) rather than
        # db.<project>.supabase.co: that direct host is IPv6-only unless the
        # project has the paid IPv4 add-on, and GitHub-hosted runners cannot
        # actually reach it (confirmed: same IPv6 address, ECONNREFUSED).
        # aws-0-us-east-1 matches this project's region (Settings ->
        # Database) — update it if the project ever migrates region.
        run: npx -y supabase@latest db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_ID}:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Build content bundles
        run: npm run content:build

      - name: Seed curriculum
        run: npm run db:seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
